id: admission_industry_taxonomy
version: 1.1-frozen
status: FROZEN
scope: gatekeeper_and_onboarding_admission
product_authority: intelligence/product_authority/gatekeeper_v1_product_execution_authority.md

purpose: Align Creator Shop admission and Intelligence runtime with the production backend IndustryVertical enum without introducing another persisted Industry enum or forcing downstream Sub-industry taxonomy into Gatekeeper.

source_of_truth:
  backend_enum: IndustryVertical
  production_repo_reference: creator-commerce-backend-v2-clone
  prisma_path: prisma/schema.prisma
  rule: Industry values used at application/admission boundaries must use IndustryVertical names exactly.

industry_vertical_values:
  supported: [D2C, SAAS_AI, HEALTHCARE, OFFLINE_SERVICES]
  unsupported_waitlist_or_regret: [REAL_ESTATE, B2B_AGENCY, MEDIA, EDUCATION, ENTERTAINMENT, UNKNOWN]
  hard_blocked: [GAMBLING, ADULT, FRAUDULENT_HIGH_RISK]

legacy_application_enums:
  BrandRoutingType:
    role: legacy_or_specialized_application_routing
    values: [D2C_SKINCARE, SAAS_PRODUCT, HEALTHCARE_TREATMENT, OFFLINE_EXPERIENCE]
    rule: Do not use as Gatekeeper or Intelligence canonical Industry.
  CollaborationIndustryType:
    role: collaboration_domain_contract
    values: [D2C_ECOMMERCE, HEALTHCARE_CLINICAL, AI_SAAS, OFFLINE_EXPERIENCES]
    rule: Keep inside collaboration/UCE boundaries; translate from IndustryVertical where required by existing application code.

alias_acceptance_at_ai_boundary:
  AI_SAAS: SAAS_AI
  SAAS: SAAS_AI
  D2C_ECOMMERCE: D2C
  ECOMMERCE: D2C
  OFFLINE_EXPERIENCES: OFFLINE_SERVICES
  OFFLINE_EXPERIENCE: OFFLINE_SERVICES
  rule: Aliases may be accepted/normalized at provider boundaries, but canonical runtime/application output is always IndustryVertical.

gatekeeper_industry:
  field: provisional_industry
  type: IndustryVertical|null
  authority: PROVISIONAL_ADMISSION_CLASSIFICATION
  rule: A Gatekeeper-produced Industry does not become reusable Brand Intelligence until the required confirmation boundary succeeds.

gatekeeper_sub_industry:
  field: provisional_sub_industry
  type: provisional_free_text
  admission_critical: false
  max_role: explanatory_or_optional_downstream_hint
  rule: Failure to fit a controlled Sub-industry must never reject an otherwise supported Industry.

confirmed_industry:
  type: IndustryVertical
  applies_after: gatekeeper_admission_and_required_confirmation
  authority: REUSABLE_BRAND_INTELLIGENCE
  rule: Only a confirmed supported IndustryVertical passes into Surface as reusable Brand Intelligence.

intelligence_sub_industry:
  type: controlled_supported_industry_taxonomy
  applies_after: supported_industry_admission_and_confirmation
  purpose: stable downstream filtering, editing, matching and reporting
  fallback_rule: Use parent-specific OTHER when no defined Sub-industry is a defensible fit.
  expansion_rule: Expand taxonomy from observed OTHER/failure patterns without changing IndustryVertical.

industry_niche:
  type: evidence_grounded_free_text
  admission_critical: false
  rule: Carries useful specificity that should not be forced into the controlled Sub-industry taxonomy.

validation:
  gatekeeper:
    provisional_industry_must_normalize_to_industry_vertical_when_non_null: true
    supported_decision_derived_from_industry_vertical_bucket: true
    provisional_sub_industry_taxonomy_membership_required: false
  downstream_intelligence:
    confirmed_industry_must_be_supported_industry_vertical: true
    controlled_sub_industry_must_belong_to_confirmed_industry: true
    industry_niche_may_be_null: true

migration_from_identity_test_taxonomy:
  AI_SAAS: SAAS_AI
  OFFLINE_EXPERIENCES: OFFLINE_SERVICES
  D2C: D2C
  HEALTHCARE: HEALTHCARE
  note: identity_test used temporary Intelligence naming. Production Gatekeeper artifacts use IndustryVertical vocabulary; the legacy Identity Gatekeeper validator remains an implementation defect until reconciled.
