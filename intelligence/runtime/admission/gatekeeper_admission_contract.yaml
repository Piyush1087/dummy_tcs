id: gatekeeper_admission_contract
version: 1.2-frozen
status: FROZEN
scope: pre_intelligence_onboarding_admission
product_authority: intelligence/product_authority/gatekeeper_v1_product_execution_authority.md
product_authority_amendment: intelligence/product_authority/gatekeeper_v1_industry_confirmation_amendment.md

purpose: Define the canonical Gatekeeper v1 admission result and production admission boundary before Surface Intelligence. Gatekeeper is an admission/serviceability capability and does not create a dedicated Intelligence branch.

architecture:
  dedicated_intelligence_branch: false
  admission_ai_processor: gatekeeper_site_assessment
  reusable_intelligence_rule: Gatekeeper Industry remains provisional admission classification until the required confirmation boundary; the explicitly user-confirmed Industry becomes downstream authority, but only a confirmed supported MVP Industry may cross the Surface boundary.
  provisional_sub_industry_rule: Gatekeeper sub-industry is an optional non-authoritative hint and is never controlled downstream Sub-industry authority.

production_alignment:
  existing_backend_entrypoints:
    - POST /api/v1/discovery/resolve
    - POST /api/v1/discovery/validate
  reuse_existing_services_where_compatible:
    - gateAndNormalizeBrandUrl
    - BrandScanGateService
    - DiscoveryReachabilityService
  frontend_entry: landing URL capture / Analyze My Brand
  rule: Preserve existing frontend/backend admission contracts where possible and replace internal classification/orchestration behind them incrementally.

submission_requirements:
  required:
    - raw_url
    - brand_ownership_or_authorization_attestation
    - terms_acceptance
    - privacy_policy_acceptance
  persistence_metadata_required:
    - normalized_domain
    - attestation_state
    - terms_version
    - privacy_policy_version
    - acceptance_timestamp
    - user_or_session_reference_when_available
  policy_version_authority: SERVER_OWNED
  ownership: APPLICATION_CONTROL

flow:
  - id: normalize_and_static_gate
    type: DETERMINISTIC
    responsibilities:
      - normalize and validate submitted URL/domain
      - reject private/reserved/local targets
      - reject prohibited social/marketplace URL cases
      - enforce configured domain/TLD restrictions
    terminal_on_failure: true

  - id: application_scan_gate
    type: APPLICATION_POLICY
    responsibilities:
      - detect existing verified brand
      - detect claimed organization
      - detect recent resumable scan
      - enforce scan/rate safeguards
      - enforce verification requirement
      - apply approved domain-specific override when present
    terminal_or_resume_outcomes: true

  - id: reachability_and_content_gate
    type: DETERMINISTIC_HTTP
    responsibilities:
      - verify reachable public site
      - validate redirect integrity
      - detect parked or unusable website conditions where deterministically resolvable
    terminal_on_failure_or_unsupported: true

  - id: gatekeeper_site_assessment
    type: AI_REASONING
    processor_contract: intelligence/runtime/admission/gatekeeper_site_assessment/processor.yaml
    responsibilities:
      - produce provisional IndustryVertical classification
      - produce provisional short sub-industry hint when useful
      - assess minimal entity category required for admission
      - assess sufficiency of English Evidence
      - assess creator-marketing applicability
      - recognize valid commercial destination modes including app-first journeys
      - emit semantic assessment confidence
    note: This processor produces admission assessment signals, not final admission outcomes.

  - id: admission_decision
    type: DETERMINISTIC
    responsibilities:
      - combine validated deterministic state and validated assessment signals
      - emit exactly one canonical Gatekeeper outcome
      - emit compact reason_code and permitted recovery actions
      - derive manual_review_eligible without auto-queuing review
      - derive confirmation requirement

  - id: industry_confirmation
    type: APPLICATION_AUTHORITY
    run_when: admission_decision.outcome == ADMITTED
    responsibilities:
      - persist assessed Industry as provenance
      - persist explicit user-confirmed Industry
      - distinguish accepted assessment from supported override and unsupported confirmation
      - set industry_disagreement_flag only for a different confirmed supported Industry
      - resolve unsupported confirmation to canonical UNSUPPORTED in backend/application authority
      - derive final Surface eligibility
    note: Supported Industry override is not an admission bypass and is independent from user-requested classification review.

canonical_result:
  gatekeeper_result:
    version:
      type: literal
      value: gatekeeper_v1
      nullable: false
      authority_category: ADMISSION_METADATA
    submission:
      normalized_url:
        type: string
        nullable: false_after_successful_normalization
        authority_category: ADMISSION_METADATA
        producer: normalize_and_static_gate
        consumer: [application_admission, reuse, verification, surface_handoff]
        persistence: required
        passes_to_surface: true
      normalized_domain:
        type: string
        nullable: false_after_successful_normalization
        authority_category: ADMISSION_METADATA
        producer: normalize_and_static_gate
        consumer: [application_admission, reuse, verification, surface_handoff]
        persistence: required
        passes_to_surface: true
    assessment:
      provisional_industry:
        type: IndustryVertical|null
        nullable: true
        authority_category: REUSABLE_INTELLIGENCE_CANDIDATE
        authority_lifecycle: provisional_admission_classification_until_confirmation
        producer: gatekeeper_site_assessment
        consumer: [admission_decision, industry_confirmation]
        persistence: versioned_gatekeeper_result_initially
        passes_to_surface: false_until_confirmed
      provisional_sub_industry:
        type: string|null
        nullable: true
        authority_category: EVIDENCE_DERIVED_SIGNAL
        producer: gatekeeper_site_assessment
        consumer: [admission_explanation, optional_downstream_hint]
        persistence: versioned_gatekeeper_result_initially
        passes_to_surface: optional_non_authoritative_hint_only
      entity_category:
        type: enum
        values: [BRAND, MARKETPLACE, CREATOR_MARKETING_PLATFORM, NON_COMMERCIAL_ENTITY, UNKNOWN]
        nullable: false_after_successful_assessment
        authority_category: EVIDENCE_DERIVED_SIGNAL
        producer: gatekeeper_site_assessment
        consumer: [admission_decision]
        persistence: versioned_gatekeeper_result_initially
        passes_to_surface: false
      english_evidence_status:
        type: enum
        values: [SUFFICIENT, INSUFFICIENT, UNCERTAIN]
        nullable: false_after_successful_assessment
        authority_category: EVIDENCE_DERIVED_SIGNAL
        producer: gatekeeper_site_assessment
        consumer: [admission_decision]
        persistence: versioned_gatekeeper_result_initially
        passes_to_surface: false
      creator_marketing_applicability:
        type: enum
        values: [APPLICABLE, NOT_APPLICABLE, UNCERTAIN]
        nullable: false_after_successful_assessment
        authority_category: EVIDENCE_DERIVED_SIGNAL
        producer: gatekeeper_site_assessment
        consumer: [admission_decision]
        persistence: versioned_gatekeeper_result_initially
        passes_to_surface: false
      commercial_destination_types:
        type: array
        item_enum: [WEBSITE, APP_STORE, PLAY_STORE, DIRECT_APK, LEAD_GENERATION, BOOKING, OFFLINE_LOCATION, SALES_CONTACT, MULTI_DESTINATION]
        nullable: false
        empty_allowed_when_unresolved: true
        authority_category: EVIDENCE_DERIVED_SIGNAL
        producer: gatekeeper_site_assessment
        consumer: [admission_decision]
        persistence: versioned_gatekeeper_result_initially
        passes_to_surface: false
      assessment_confidence:
        type: enum
        values: [HIGH, MEDIUM, LOW]
        nullable: false_after_successful_assessment
        authority_category: ADMISSION_METADATA
        producer: gatekeeper_site_assessment
        consumer: [gatekeeper_scan, admission_decision]
        persistence: versioned_gatekeeper_result_initially
        passes_to_surface: false
    decision:
      outcome:
        type: enum
        values: [ADMITTED, RESUME_AVAILABLE, EXISTING_BRAND, ORG_CLAIMED, VERIFICATION_REQUIRED, UNSUPPORTED, UNSUPPORTED_LANGUAGE, CLASSIFICATION_UNCERTAIN, HARD_BLOCKED, DOMAIN_UNREACHABLE, DOMAIN_INVALID, TECHNICAL_FAILURE]
        nullable: false
        authority_category: ADMISSION_DECISION
        producer: admission_decision_or_terminal_deterministic_gate_or_industry_confirmation
        persistence: required
        passes_to_surface: precondition_only
      reason_code:
        type: string|null
        nullable: true
        authority_category: ADMISSION_DECISION
        producer: admission_decision_or_terminal_deterministic_gate_or_industry_confirmation
        vocabulary: compact_extensible_v1_only
        persistence: required
        passes_to_surface: false
      recovery_actions:
        type: array
        item_enum: [CONTINUE, RESUME, SIGN_IN, REQUEST_ORG_ACCESS, VERIFY_DOMAIN, JOIN_WAITLIST, REQUEST_CLASSIFICATION_REVIEW, RETRY, CONTACT_SUPPORT]
        nullable: false
        authority_category: ADMISSION_DECISION
        producer: admission_decision_or_terminal_deterministic_gate_or_industry_confirmation
        persistence: required
        passes_to_surface: false
      manual_review_eligible:
        type: boolean
        nullable: false
        authority_category: ADMISSION_DECISION
        producer: admission_decision_or_industry_confirmation
        persistence: required
        passes_to_surface: false
        rule: true means classification review may be requested for the current admission outcome; it does not mean review is automatically queued or required and is independent of industry_disagreement_flag.
    confirmation:
      assessed_industry:
        type: IndustryVertical|null
        nullable: true_until_assessment
        authority_category: ADMISSION_PROVENANCE
        producer: gatekeeper_site_assessment
        persistence: required_after_confirmation_attempt
        rule: Preserve the AI-assessed Industry even when the user confirms a different Industry.
      confirmed_industry:
        type: IndustryVertical|null
        nullable: true_until_user_confirmation
        authority_category: USER_CONFIRMED_AUTHORITY
        producer: industry_confirmation
        persistence: required_after_confirmation_attempt
        rule: A confirmed supported MVP Industry becomes downstream Brand Intelligence authority. A confirmed unsupported Industry is persisted but cannot cross the Surface boundary.
      confirmation_source:
        type: enum|null
        values: [AI_ASSESSED_ACCEPTED, USER_CONFIRMED_OVERRIDE, USER_CONFIRMED_UNSUPPORTED]
        nullable: true_until_user_confirmation
        authority_category: ADMISSION_PROVENANCE
        producer: industry_confirmation
        persistence: required_after_confirmation_attempt
      industry_disagreement_flag:
        type: boolean
        nullable: false
        default: false
        authority_category: OPERATIONAL_REVIEW_METADATA
        producer: industry_confirmation
        persistence: required
        rule: true only when the user explicitly confirms a different supported MVP Industry. It is not manual_review_eligible and does not imply REQUEST_CLASSIFICATION_REVIEW.
      surface_eligible:
        type: boolean
        nullable: false
        authority_category: ADMISSION_DECISION
        producer: industry_confirmation
        persistence: required_or_derivable
        rule: true only after ADMITTED Gatekeeper assessment plus explicit confirmation of a supported MVP Industry and all remaining application preconditions.
    handoff:
      gatekeeper_completed:
        type: boolean
        nullable: false
        authority_category: ADMISSION_METADATA
        producer: gatekeeper_scan
        persistence: required_or_derivable
        passes_to_surface: true
      confirmed_industry_required:
        type: boolean
        nullable: false
        authority_category: ADMISSION_DECISION
        producer: admission_decision
        persistence: required_or_derivable
        passes_to_surface: precondition_only

reason_code_policy:
  rule: Keep the vocabulary compact and limited to implemented/frozen v1 conditions. Add codes only when a distinct operational or recovery behavior requires them.
  initial_codes:
    - INVALID_URL
    - PRIVATE_OR_LOCAL_HOST
    - PROHIBITED_URL
    - BLOCKED_DOMAIN_OR_TLD
    - EXISTING_VERIFIED_BRAND
    - ORGANIZATION_ALREADY_CLAIMED
    - RECENT_RESUMABLE_SCAN
    - DOMAIN_VERIFICATION_REQUIRED
    - DNS_OR_TIMEOUT
    - REDIRECT_INTEGRITY_FAILED
    - PARKED_OR_UNUSABLE_WEBSITE
    - INSUFFICIENT_ENGLISH_EVIDENCE
    - UNSUPPORTED_INDUSTRY
    - CREATOR_MARKETING_NOT_APPLICABLE
    - HARD_BLOCKED_INDUSTRY
    - UNKNOWN_CLASSIFICATION
    - AMBIGUOUS_ENTITY
    - CONFLICTING_EVIDENCE
    - INSUFFICIENT_EVIDENCE
    - PROVIDER_CHAIN_EXHAUSTED

review_concept_separation:
  industry_disagreement_flag:
    meaning: Operational marker for assessed-vs-confirmed supported Industry disagreement.
    blocks_surface: false
    user_requested_review: false
  manual_review_eligible:
    meaning: Current Gatekeeper outcome permits the user to request classification review.
    auto_queue: false
  REQUEST_CLASSIFICATION_REVIEW:
    meaning: Explicit user recovery action when permitted by canonical backend authority.
    implied_by_industry_disagreement_flag: false

manual_review_policy:
  eligible_outcomes: [CLASSIFICATION_UNCERTAIN, UNSUPPORTED]
  required_recovery_action_when_eligible: REQUEST_CLASSIFICATION_REVIEW
  hard_block_eligible: false
  auto_queue_review: false

user_confirmation_boundary:
  required_before_surface_execution: true
  assessed_field: provisional_industry
  confirmed_field: confirmed_industry
  supported_mvp_industries: [D2C, SAAS_AI, HEALTHCARE, OFFLINE_SERVICES]
  same_supported_industry:
    confirmation_source: AI_ASSESSED_ACCEPTED
    industry_disagreement_flag: false
    final_outcome: ADMITTED
    surface_eligible: true
  different_supported_industry:
    frontend_warning_required: true
    explicit_confirmation_required: true
    confirmation_source: USER_CONFIRMED_OVERRIDE
    industry_disagreement_flag: true
    final_outcome: ADMITTED
    confirmed_value_becomes_reusable_brand_intelligence: true
    operational_review_may_follow: true
    manual_review_eligible_implied: false
    classification_review_action_implied: false
    surface_eligible: true
  unsupported_industry:
    frontend_warning_required: true
    explicit_confirmation_required: true
    confirmation_source: USER_CONFIRMED_UNSUPPORTED
    final_outcome: UNSUPPORTED
    reason_code: UNSUPPORTED_INDUSTRY
    surface_eligible: false
    rule: Frontend must consume the backend/application result and must not manufacture UNSUPPORTED locally.

surface_handoff:
  required:
    - normalized_url
    - normalized_domain
    - confirmed_industry
    - gatekeeper_completed
  eligibility_rule: confirmed_industry must be one of [D2C, SAAS_AI, HEALTHCARE, OFFLINE_SERVICES] and confirmation.surface_eligible must be true.
  optional:
    - provisional_sub_industry
  optional_rule: provisional_sub_industry may be passed only as a non-authoritative hint when the downstream processor needs it.
  excluded:
    - assessment_confidence
    - entity_category
    - english_evidence_status
    - creator_marketing_applicability
    - commercial_destination_types
    - reason_code
    - recovery_actions
    - manual_review_eligible
    - industry_disagreement_flag
    - confirmation_source
    - provider_or_model_metadata
    - latency_or_token_usage

persistence_alignment:
  current_backend_candidate: DiscoveryLead/session structures
  current_known_fields: [rawUrl, normalizedUrl, status, isSupported, industry, subIndustry, securityScore, temporaryPayload, expiresAt, classificationEvidence, userId]
  gatekeeper_assessment_signals: persist_as_one_versioned_structured_result_initially
  exact_field_or_model: OPEN_PENDING_RUNTIME_RECONCILIATION
  first_class_columns_for_each_signal: false
  submission_control_rule: Ownership/Terms/Privacy acceptance requires durable application/legal auditability; server-owned policy versions are authoritative.
  rule: Do not create a parallel Intelligence value store.

telemetry_boundary:
  rule: Provider/model/evidence-run/latency/token/fallback metadata belongs to shared execution telemetry/provenance, not the Gatekeeper reusable result or Surface handoff.
