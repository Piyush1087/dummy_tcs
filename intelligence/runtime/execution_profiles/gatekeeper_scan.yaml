id: gatekeeper_scan
version: 1.0-frozen
status: FROZEN
scope: pre_intelligence_admission
purpose: Qualify a submitted brand domain before any Surface/Deep Intelligence profile is allowed to run.

defaults:
  persist_results: true
  allow_parallelism: false

inputs:
  required: [raw_url]
  contextual: [client_ip, authenticated_user_id]

stages:
  - id: normalize_and_static_gate
    kind: DETERMINISTIC
    implementation_binding: existing_backend.gateAndNormalizeBrandUrl
    required: true
    terminal_on_failure: true

  - id: application_scan_gate
    kind: APPLICATION_POLICY
    implementation_binding: existing_backend.BrandScanGateService.evaluateEntry
    required: true
    dependencies: [normalize_and_static_gate]
    terminal_or_resume_outcomes: true

  - id: reachability_and_content_gate
    kind: DETERMINISTIC_HTTP
    implementation_binding: existing_backend.DiscoveryReachabilityService.probe
    required: true
    dependencies: [application_scan_gate]
    terminal_on_failure_or_waitlist: true

  - id: ai_site_and_industry_classification
    kind: AI
    processor_id: industry_classification
    processor_scope: gatekeeper
    required: true
    dependencies: [reachability_and_content_gate]
    access_mode: website_direct
    model_profile: fast_classification
    active_outputs: [industry, provisional_sub_industry, confidence]
    taxonomy_contract: runtime/admission/taxonomy_contract.yaml
    rules:
      - output Industry using production IndustryVertical vocabulary
      - do not require controlled Sub-industry membership
      - do not crawl through Zyte/Cheerio

  - id: admission_decision
    kind: DETERMINISTIC
    required: true
    dependencies: [ai_site_and_industry_classification]
    rules:
      supported: [D2C, SAAS_AI, HEALTHCARE, OFFLINE_SERVICES]
      waitlist_or_reject: [REAL_ESTATE, B2B_AGENCY, MEDIA, EDUCATION, ENTERTAINMENT, UNKNOWN]
      hard_block: [GAMBLING, ADULT, FRAUDULENT_HIGH_RISK]

outputs:
  canonical_url: string
  hostname: string
  admission_outcome: enum
  industry: IndustryVertical|null
  provisional_sub_industry: string|null
  confidence: integer|null
  discovery_lead_id: string|null
  rejection_or_waitlist_reason: string|null

handoff:
  eligible_outcome: REQUIRE_INDUSTRY_CONFIRMATION
  downstream_profile: surface_deep_intelligence
  downstream_precondition: supported IndustryVertical confirmed by user

notes:
  - This profile replaces Gatekeeper as a task inside the production Identity/Surface execution graph.
  - Existing /discovery/resolve and /discovery/validate contracts should remain the frontend-facing admission API unless a later journey decision requires changing them.
  - The existing identity_test profile may continue to include Gatekeeper for isolated runtime testing, but must not be treated as the production onboarding profile.
  - Appeal/whitelist behavior is intentionally not frozen here and will be designed in the next journey pass.
