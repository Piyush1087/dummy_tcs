id: identity_onboarding
version: 1.0-working
status: WORKING

purpose: Execute the Brand Intelligence > Identity branch for the onboarding journey, including fast eligibility classification, parallel website evidence acquisition, core identity extraction, the one-time user checkpoint, and completion of dependent Identity intelligence.

architecture_boundary:
  - This profile defines execution order, concurrency, gates, prerequisites and active processor scopes.
  - It does not define what event starts execution. Manual, onboarding, scheduled or other triggers belong to the separate Trigger layer.
  - The Intelligence Compiler executes this profile whenever it is invoked with this profile ID and valid runtime context.
  - Evidence Acquisition work may run concurrently with Intelligence processor execution but remains outside the Intelligence Compiler's AI reasoning responsibility.

entity:
  entity_type: brand
  entity_id: runtime_required

execution_mode:
  supported: [FULL, PARTIAL]
  default_for_onboarding: FULL
  semantics:
    FULL: Execute all stages applicable to this profile, subject to eligibility and checkpoint gates.
    PARTIAL: Execute only explicitly requested processors/output scopes plus their required fresh dependencies; existing Intelligence Objects alone do not satisfy a fresh dependency when the profile marks fresh_execution_required=true.

runtime_inputs:
  required:
    - entity_type
    - entity_id
    - website_url
  optional:
    - requested_processors
    - requested_outputs
    - existing_intelligence
    - connected_source_availability
    - execution_reason

preflight:
  fail_before_execution_if:
    - entity_type != brand
    - entity_id is missing
    - website_url is missing_or_invalid
    - industry_classification processor definition cannot be loaded
    - required gatekeeper artifacts cannot be loaded
    - configured gatekeeper model/provider is unavailable_at_dispatch
  note: Preflight prevents avoidable compiler execution. Runtime provider/network failures after dispatch are handled as execution failures.

stages:
  - id: stage_0_gatekeeper_and_acquisition
    execution: PARALLEL
    tasks:
      - id: gatekeeper
        owner: intelligence_compiler
        processor: industry_classification
        scope: gatekeeper
        input_source: website_direct
        active_outputs: [industry, sub_industry]
        fresh_execution_required: true
        blocking_for_stage_completion: true

      - id: website_evidence_acquisition
        owner: evidence_acquisition
        operation: build_website_evidence
        start_scope: homepage_then_discovered_pages
        blocking_for_stage_completion: false
        cancellable: true

    gatekeeper_routes:
      RESOLVED_SUPPORTED:
        action: CONTINUE
      RESOLVED_UNSUPPORTED:
        action: STOP_PROFILE
        onboarding_result: UNSUPPORTED_BUSINESS
        acquisition_action: CANCEL_OR_DISCARD_WHERE_PRACTICAL
      UNRESOLVED_UNKNOWN:
        action: STOP_PROFILE
        onboarding_result: INDUSTRY_UNRESOLVED
        acquisition_action: CANCEL_OR_DISCARD_WHERE_PRACTICAL
        diagnostic_policy: retain_runtime_failure_and_evidence_diagnostics_for_pattern_analysis

  - id: stage_1_core_identity
    starts_when:
      - gatekeeper route == RESOLVED_SUPPORTED
      - required Website Evidence for identity_core is available
    tasks:
      - id: identity_core
        owner: intelligence_compiler
        processor: identity_core
        scope: requested_or_full
        input_source: website_evidence
        active_outputs:
          full: [brand_name, brand_logo, tagline, country, business_geography, primary_language, website_currency, instagram_handle, youtube_handle, tiktok_handle, facebook_handle, linkedin_handle]
        fresh_execution_required: true

      - id: reporting_currency
        owner: deterministic_runtime
        operation: derive_reporting_currency
        depends_on:
          processor: identity_core
          output: country
          fresh_execution_required: true
        mapping:
          IN: INR
          US: USD
          DEFAULT: USD
        note: reporting_currency is an Identity Object but not an AI processor output.

    completion_requirement:
      - onboarding checkpoint-required objects must be resolved or explicitly handled by their object contract before checkpoint presentation.

  - id: stage_2_identity_checkpoint
    type: USER_CHECKPOINT
    checkpoint_id: identity_one_time_confirmation
    starts_when:
      - stage_1_core_identity completed successfully
    review_objects:
      - brand_name
      - instagram_handle
      - youtube_handle
      - tiktok_handle
      - facebook_handle
      - linkedin_handle
      - industry
      - sub_industry
      - country
      - website_currency
    ui_grouping_note: social handles may be presented as one UI group while remaining separate Intelligence Objects.
    behavior:
      - Present resolved values to the user for one-time review/correction.
      - Pause this execution profile until explicit user confirmation is recorded.
      - The checkpoint is a continuation gate, not a Trigger Engine rule and not a processor dependency.
      - User corrections become canonical values before downstream processors execute.
      - Once confirmed, checkpoint-controlled objects are locked according to their Identity Object lifecycle definitions.
    on_confirm: RESUME_PROFILE
    on_abandon: REMAIN_PAUSED_OR_EXPIRE_PER_APPLICATION_POLICY

  - id: stage_3_dependent_identity
    starts_when:
      - identity_one_time_confirmation == CONFIRMED
    execution: PARALLEL_WHERE_DEPENDENCIES_ALLOW
    tasks:
      - id: industry_niche
        owner: intelligence_compiler
        processor: industry_classification
        scope: industry_niche
        active_outputs: [industry_niche]
        canonical_dependencies: [industry, sub_industry]
        dependency_semantics: use_current_canonical_values_after_checkpoint
        fresh_execution_required: true

      - id: market_geography
        owner: intelligence_compiler
        processor: market_geography
        active_outputs: [markets_served]
        canonical_dependencies: [country]
        optional_canonical_context: [business_geography]
        evidence:
          required: [website_evidence]
          optional: [similarweb_geography, instagram_audience_geography]
        external_evidence_wait_policy: DO_NOT_BLOCK_FOR_OPTIONAL_SOURCES
        fresh_execution_required: true

    note: industry_niche and market_geography may execute concurrently because neither depends on the other's output.

completion:
  success_when:
    - gatekeeper was RESOLVED_SUPPORTED
    - identity checkpoint was confirmed
    - all required selected tasks completed
    - outputs passed their processor output contracts
    - resulting Intelligence Objects were persisted successfully
  result: IDENTITY_ONBOARDING_COMPLETE

partial_execution_policy:
  - Compiler receives explicit requested_processors and/or requested_outputs.
  - Compiler resolves the owning processor from the processor/object definitions; callers should not need to address a processor by file path.
  - Execute only the required scope of a multi-scope processor when its processor contract permits partial scope execution.
  - Do not rerun unrelated outputs merely because they share a processor.
  - If a requested output requires a dependency, evaluate the dependency freshness rule rather than merely checking whether an old object exists.
  - A user-confirmed locked canonical value is consumed as canonical context and is not overwritten by downstream partial execution.

parallel_execution_policy:
  - PARALLEL is declarative profile intent; the compiler/orchestrator must translate it into concurrent task dispatch.
  - Independent AI tasks may be dispatched to separate workers/jobs concurrently.
  - A task becomes runnable only when its declared fresh dependencies and gates are satisfied.
  - Parallel execution must not bypass output validation, persistence, or failure handling.

failure_policy:
  preflight_failure:
    action: DO_NOT_START
    persist_execution_record: true
  gatekeeper_business_outcome:
    action: STOP_AS_EXPECTED_ONBOARDING_OUTCOME
    technical_failure: false
  processor_or_provider_failure:
    action: FAIL_TASK
    persist_execution_record: true
    return_structured_error: true
  output_contract_failure:
    action: FAIL_TASK
    persist_validation_error: true
    do_not_persist_invalid_intelligence: true
  evidence_unavailable:
    required_evidence: FAIL_OR_WAIT_ACCORDING_TO_TASK_REQUIREMENT
    optional_external_evidence: CONTINUE_WITH_AVAILABLE_EVIDENCE
  persistence_failure:
    action: FAIL_TASK
    do_not_report_profile_success: true
  checkpoint_timeout_or_abandonment:
    action: PROFILE_NOT_COMPLETE
    technical_failure: false

runtime_record_requirements:
  - execution_profile_id
  - execution_id
  - entity_type
  - entity_id
  - execution_mode
  - execution_reason_when_supplied
  - stage_and_task_status
  - processor_execution_ids
  - evidence_acquisition_run_ids_when_applicable
  - checkpoint_status
  - started_at
  - completed_at
  - structured_errors

non_goals:
  - This profile does not define trigger schedules/events.
  - This profile does not contain processor reasoning or taxonomy.
  - This profile does not define model selection; model/runtime configuration is supplied through the compiler/prompt package/runtime configuration.
  - This profile does not define Evidence semantics; those live in the branch Evidence contract.
