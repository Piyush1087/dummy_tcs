id: identity_core
version: 1.0-frozen
status: FROZEN
engine: brand_intelligence
branch: identity
executor: ai

purpose: Resolve the brand's core owned identity from normalized website evidence after eligibility classification.

outputs:
  - brand_name
  - brand_logo
  - tagline
  - country
  - business_geography
  - primary_language
  - website_currency
  - instagram_handle
  - youtube_handle
  - tiktok_handle
  - facebook_handle
  - linkedin_handle

inputs:
  required:
    - website_url
    - normalized_homepage_evidence
  optional:
    - normalized_about_evidence
    - normalized_contact_evidence
    - structured_metadata_evidence

input_policy:
  required_means: Processor cannot execute the relevant scope without this input.
  optional_means: Absence does not block execution and must not cause fabricated output.

execution:
  can_run_independently: true
  partial_output_supported: true
  protected_output_policy: Compiler removes permanently locked or manual-protected objects from active output scope before execution.

post_processing:
  reporting_currency:
    source: country
    type: deterministic_derivation
    rule: India=INR; United_States=USD; Rest_of_World=USD
    note: reporting_currency is an Identity object but does not require its own processor or AI output.

artifacts:
  reasoning: to_define
  taxonomy: to_define_only_where_needed
  examples: to_define_if_needed
  output_contract: to_define

failure_policy:
  fail_if_required_input_missing: true
  fail_if_output_contract_invalid: true
  nullable_optional_outputs_allowed: true
  no_silent_default: true
