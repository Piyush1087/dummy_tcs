id: industry_classification
version: 1.0-working
engine: brand_intelligence
branch: identity
executor: ai

purpose: Identify the brand's canonical industry and sub-industry for eligibility routing and downstream intelligence.

outputs:
  - industry
  - sub_industry

inputs:
  required:
    - website_url
  optional: []

acquisition_mode:
  current_mvp: gemini_direct_website
  replaceable: true
  note: The processor contract is independent of acquisition implementation. A future Zyte-first flow can replace direct website access with normalized homepage evidence without changing output ownership.

artifacts:
  reasoning: to_define
  taxonomy: to_define
  examples: to_define_if_needed
  output_contract: to_define

execution:
  blocking: true
  can_run_independently: true
  partial_output_supported: false

failure_policy:
  fail_if_required_input_missing: true
  fail_if_output_contract_invalid: true
  no_silent_default: true
