id: platform_currency_resolver
version: 1.0-working
engine: brand_intelligence
branch: identity
executor: rule

purpose: Derive Creator Shop's reporting and transaction currency from the canonical brand country.

outputs:
  - reporting_currency

inputs:
  required:
    - country
  optional: []

rule:
  India: INR
  United_States: USD
  default: USD

artifacts:
  reasoning: none
  taxonomy: none
  examples: none
  output_contract: to_define

execution:
  blocking: true
  can_run_independently: true
  partial_output_supported: false

failure_policy:
  fail_if_required_input_missing: true
  fail_if_country_invalid: true
  no_ai_fallback: true
