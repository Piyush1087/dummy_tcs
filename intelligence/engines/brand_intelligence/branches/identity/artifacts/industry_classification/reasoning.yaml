id: industry_classification_reasoning
version: 1.0-working
status: WORKING
processor: industry_classification

purpose: Define how the processor determines industry, sub-industry and industry niche without duplicating global evidence-grounding rules.

scopes:
  gatekeeper:
    outputs: [industry, sub_industry]
    objective: Rapidly classify the brand well enough to determine platform eligibility and establish canonical classification anchors for subsequent intelligence.
    evidence_mode: direct_homepage

    reasoning_order:
      - Identify what the business primarily sells or delivers from homepage evidence.
      - Identify the business model/context needed to interpret that offering correctly.
      - Select the best-fitting canonical industry from the taxonomy.
      - Select the best-fitting canonical sub-industry permitted under that industry.
      - Prefer the brand's primary business over secondary categories, content topics, customer use cases or incidental offerings.
      - If multiple businesses are represented, classify the consumer-facing brand/entity at the submitted domain rather than an unrelated parent/portfolio company unless the site itself represents the parent entity.

    homepage_signals:
      strong:
        - explicit description of products/services
        - homepage title/meta description
        - H1 and primary hero proposition
        - primary navigation/category structure
        - structured organization/product/service signals
      supporting:
        - footer business description
        - prominent collection/service links
        - repeated terminology across homepage sections
      weak_only:
        - isolated blog/article topics
        - generic marketing language
        - incidental partner/customer logos

    ambiguity_policy:
      - Do not force a narrow sub-industry when homepage evidence supports only the parent category.
      - Do not infer industry from brand name alone.
      - Use taxonomy definitions and precedence rules when a business plausibly spans categories.
      - If classification cannot meet the output contract's minimum certainty/validity requirement, return the contract-defined unresolved state rather than inventing a category.

  industry_niche:
    outputs: [industry_niche]
    objective: Determine a useful specific niche after industry and sub-industry have become canonical inputs.
    evidence_mode: normalized_website_evidence

    authoritative_inputs:
      - industry
      - sub_industry

    reasoning_order:
      - Treat current canonical industry and sub-industry as fixed constraints; never reclassify them in this scope.
      - Examine homepage plus available offering/product/service evidence for the brand's dominant specialization.
      - Select a niche only if it adds meaningful specificity beyond sub-industry and is supported by evidence.
      - Prefer a stable business specialization over temporary campaigns, individual products or marketing claims.
      - Return null/unresolved when no meaningful niche can be supported.

manual_correction_rule:
  description: If the user changes industry or sub-industry at the Identity checkpoint, later niche execution must use the corrected canonical values. Earlier AI classification must not remain an implicit constraint.
