id: industry_classification_output_contract
version: 1.0-working
status: WORKING
processor: industry_classification

purpose: Define the machine-valid structured output returned by the AI executor for each active processor scope.

contracts:
  gatekeeper:
    active_outputs: [industry, sub_industry]
    response:
      type: object
      additional_properties: false
      required:
        - industry
        - sub_industry
      properties:
        industry:
          type: string
          constraint: must_match_taxonomy
        sub_industry:
          type: string
          constraint: must_belong_to_industry

  industry_niche:
    active_outputs: [industry_niche]
    response:
      type: object
      additional_properties: false
      required:
        - industry_niche
      properties:
        industry_niche:
          type: [string, 'null']
          constraint: must_be_compatible_with_canonical_industry_and_sub_industry

validation:
  reject_extra_fields: true
  reject_taxonomy_mismatch: true
  reject_invalid_parent_child_combination: true
  gatekeeper_null_policy: unresolved_behavior_to_freeze
  niche_null_allowed: true

note: Evidence references/confidence are not added here until we decide whether they are universal runtime metadata, processor output, or evaluation-only fields. Avoid bloating every intelligence contract by default.
