id: industry_classification_output_contract
version: 1.0-frozen
status: FROZEN
processor: industry_classification

purpose: Define the machine-valid structured output returned by the AI executor for each active processor scope.

contracts:
  gatekeeper:
    active_outputs: [industry, sub_industry]
    response:
      type: object
      additional_properties: false
      required:
        - status
        - industry
        - sub_industry
      properties:
        status:
          type: string
          enum: [RESOLVED, UNRESOLVED]
        industry:
          type: [string, 'null']
          constraint: when_status_RESOLVED_must_match_canonical_industry_taxonomy
        sub_industry:
          type: [string, 'null']
          constraint: when_status_RESOLVED_must_belong_to_industry

    invariants:
      - RESOLVED requires non-null valid industry and sub_industry.
      - UNRESOLVED requires industry=null and sub_industry=null.
      - Parent-specific OTHER is a valid resolved Sub-industry when Industry is known but the MVP taxonomy lacks a defensible specific match.
      - Legacy Industry enum values are invalid outputs.

  industry_niche:
    active_outputs: [industry_niche]
    response:
      type: object
      additional_properties: false
      required:
        - industry_niche
      properties:
        industry_niche:
          type: [string, 'null']
          constraint: must_be_evidence_supported_and_compatible_with_canonical_industry_and_sub_industry

    invariants:
      - null is valid when no meaningful evidence-supported niche can be established.
      - niche must not alter or contradict canonical Industry or Sub-industry.

validation:
  reject_extra_fields: true
  reject_taxonomy_mismatch: true
  reject_invalid_parent_child_combination: true
  reject_legacy_industry_values: true
  reject_partial_gatekeeper_resolution: true
  niche_null_allowed: true

runtime_metadata_policy:
  note: Model, token usage, latency, failures, evidence/provenance references and other execution telemetry are not business intelligence fields in this output contract. They belong to execution/runtime records unless a later global contract explicitly requires otherwise.
