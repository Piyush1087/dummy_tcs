id: industry_classification_taxonomy
version: 1.1-frozen
status: FROZEN
processor: industry_classification

purpose: Controlled downstream Industry/Sub-industry taxonomy for supported brands after Gatekeeper admission. Top-level Industry uses the existing production backend IndustryVertical vocabulary; this file does not define a new persisted Industry enum.

canonical_industry_contract:
  status: FROZEN
  source_of_truth: production Prisma IndustryVertical
  supported_values:
    - D2C
    - SAAS_AI
    - HEALTHCARE
    - OFFLINE_SERVICES
  rule: Downstream Brand Intelligence executes only for these confirmed supported IndustryVertical values.

admission_boundary:
  gatekeeper_taxonomy_contract: intelligence/runtime/admission/taxonomy_contract.yaml
  rule: Gatekeeper admission is outside the Identity/Surface-Deep branch. Gatekeeper Sub-industry is provisional free text and is not validated against this controlled list.

legacy_application_enums:
  BrandRoutingType:
    D2C_SKINCARE: D2C
    SAAS_PRODUCT: SAAS_AI
    HEALTHCARE_TREATMENT: HEALTHCARE
    OFFLINE_EXPERIENCE: OFFLINE_SERVICES
  CollaborationIndustryType:
    D2C_ECOMMERCE: D2C
    AI_SAAS: SAAS_AI
    HEALTHCARE_CLINICAL: HEALTHCARE
    OFFLINE_EXPERIENCES: OFFLINE_SERVICES
  adapter_rule: Legacy/specialized enums remain inside their existing application domains. They are not additional canonical Industry taxonomies.

hierarchy:
  D2C:
    label: D2C
    sub_industries:
      - id: BEAUTY_PERSONAL_CARE
        label: Beauty & Personal Care
      - id: FASHION_APPAREL
        label: Fashion & Apparel
      - id: FOOD_BEVERAGE
        label: Food & Beverage
      - id: HOME_LIVING
        label: Home & Living
      - id: OTHER_D2C
        label: Other D2C

  SAAS_AI:
    label: AI / SaaS
    sub_industries:
      - id: MARKETING_SALES
        label: Marketing & Sales
      - id: PRODUCTIVITY_COLLABORATION
        label: Productivity & Collaboration
      - id: FINANCE_FINTECH
        label: Finance & FinTech
      - id: HR_RECRUITMENT
        label: HR & Recruitment
      - id: OTHER_SAAS_AI
        label: Other AI / SaaS

  HEALTHCARE:
    label: Healthcare
    sub_industries:
      - id: REPRODUCTIVE_MEDICINE
        label: Reproductive Medicine
      - id: DERMATOLOGY
        label: Dermatology
      - id: DENTAL_CARE
        label: Dental Care
      - id: DIAGNOSTICS
        label: Diagnostics
      - id: OTHER_HEALTHCARE
        label: Other Healthcare

  OFFLINE_SERVICES:
    label: Offline Experiences / Services
    sub_industries:
      - id: FITNESS_WELLNESS
        label: Fitness & Wellness
      - id: HOSPITALITY
        label: Hospitality
      - id: EDUCATION_TRAINING
        label: Education & Training
      - id: EVENTS_ENTERTAINMENT
        label: Events & Entertainment
      - id: OTHER_OFFLINE_SERVICES
        label: Other Offline Experiences / Services

sub_industry_policy:
  status: MVP_FROZEN
  controlled_taxonomy: true
  stage: downstream_intelligence_after_supported_industry_confirmation
  user_edit_control: dependent_searchable_dropdown
  ai_output_control: must_select_from_taxonomy
  expansion_rule: Add recurring categories based on production scan evidence/OTHER frequency without changing the processor or IndustryVertical.
  fallback_rule: Use the parent-specific OTHER value when no current specific category is defensible. Never reject a supported brand because a more specific Sub-industry is absent.

industry_niche_policy:
  status: FROZEN
  controlled_taxonomy: false
  type: evidence_grounded_nullable_string
  rule: Industry niche provides specific evidence-supported specialization and may carry useful detail missing from the intentionally coarse Sub-industry taxonomy.

classification_principles:
  - Industry is the stable production IndustryVertical value.
  - Gatekeeper Sub-industry is provisional and free text.
  - Downstream Sub-industry is controlled and constrained by confirmed Industry.
  - Industry niche is free-form, evidence-grounded specificity.
  - Taxonomy classifies the business, not merely website content topics.
  - Pharma placement remains a deliberate future taxonomy decision.

validation:
  gatekeeper_legacy_rejection_rule_removed: true
  note: Provider aliases are normalized at the admission/provider boundary; canonical IndustryVertical values must never be rejected because the same string also appears in another legacy/specialized enum.
  downstream_industry_must_be_supported_industry_vertical: true
  downstream_sub_industry_must_belong_to_industry: true
  other_sub_industry_must_match_parent_industry: true
  niche_must_be_compatible_with_confirmed_industry_and_sub_industry: true
  allow_null_niche: true
