id: market_geography_reasoning
version: 1.0-working
status: WORKING
processor: market_geography

purpose: Determine the markets the brand actually serves by combining owned Website Evidence with optional Similarweb and Instagram geography evidence, while keeping business geography, demand geography and audience geography conceptually separate.

principles:
  - Apply global evidence_grounding rules.
  - markets_served means where the brand can meaningfully sell/deliver its products, services or experience; it is not simply where traffic or followers come from.
  - Website Evidence is always a valid primary source and becomes the sole evidence source when Similarweb and Instagram evidence are unavailable.
  - Similarweb and Instagram are supporting/corroborating sources, not mandatory dependencies.
  - Business geography is the complete fallback when no defensible market can be derived from available market evidence.
  - Never return no market merely because external evidence is unavailable when canonical business geography exists.

inputs:
  canonical_intelligence:
    required:
      - country
    optional:
      - business_geography
  evidence:
    required:
      - website_evidence.homepage
    optional:
      - website_evidence.about
      - website_evidence.contact
      - website_evidence.locations
      - website_evidence.shipping
      - website_evidence.service
      - website_evidence.offering
      - website_evidence.product
      - website_evidence.collection
      - similarweb_geography
      - instagram_audience_geography

source_meaning:
  website:
    role: primary_commercial_availability_evidence
    high_value_signals:
      - explicit shipping destinations
      - explicit service areas
      - location/service radius statements
      - explicit countries/cities/regions served
      - store/clinic/studio/location network when service is location-bound
      - explicit national/global availability statements
      - product/service availability restrictions
    supporting_signals:
      - country-specific offerings or landing pages
      - currency/language variants when clearly tied to availability
      - repeated geographic targeting across owned pages
    caution:
      - A business address alone proves business geography, not necessarily the full market.
      - A location list may indicate operating locations but should be interpreted according to the business model.

  similarweb:
    role: demand_geography_support
    meaning: Indicates where website traffic/demand is observed.
    rules:
      - Use to corroborate, prioritize or challenge website-derived market hypotheses.
      - Do not convert a high traffic share into a served market when the website explicitly excludes that geography.
      - Strong concentration in a geography may support primary-market ranking when commercial availability is otherwise plausible.

  instagram:
    role: audience_geography_support
    meaning: Indicates where the connected Instagram audience is observed.
    rules:
      - Use as supporting evidence for market relevance, especially where website availability is broad.
      - Do not treat follower geography alone as proof that the brand serves that geography.
      - Do not override explicit website shipping/service restrictions with audience geography.

reasoning_order:
  - Establish the business model/geographic nature needed to interpret availability: location-bound, nationally deliverable, digitally deliverable, or multi-market.
  - Extract explicit commercial/service geography from Website Evidence first.
  - Build defensible candidate markets from explicit website availability and service-area evidence.
  - If Similarweb evidence exists, use it to corroborate and rank candidate markets or identify plausible markets requiring support from owned-site availability.
  - If Instagram audience geography exists, use it as additional corroboration/relevance evidence.
  - Resolve market granularity appropriate to the business: locality/region, country, multiple countries, or GLOBAL.
  - If external evidence is absent, complete the reasoning using Website Evidence only.
  - If Website Evidence does not establish a defensible market, fall back to canonical business_geography; if business_geography is unavailable, fall back to canonical country.

business_model_guidance:
  location_bound:
    examples: [clinic, studio, local_service, venue]
    rule: Prefer explicit locality/service-area evidence. A Kanpur clinic may resolve to Kanpur or a stated service radius rather than all of India merely because its website is nationally accessible.

  nationally_deliverable:
    examples: [domestic_ecommerce, nationwide_service]
    rule: Resolve the country when owned evidence supports nationwide shipping/service; use external geography mainly for prioritization, not to shrink an explicitly nationwide market.

  digitally_deliverable:
    examples: [saas, digital_service]
    rule: Global technical accessibility is not automatically GLOBAL commercial market. Prefer explicit customer/availability/geographic positioning; use Similarweb and Instagram to identify meaningful primary markets when appropriate.

  multi_market:
    examples: [international_ecommerce, global_saas, multi_country_service]
    rule: Return multiple markets when commercial availability is supported. External evidence may help identify which are primary, but must not invent availability.

conflict_resolution:
  - Explicit commercial restrictions on the owned website outrank Similarweb traffic and Instagram audience geography.
  - Explicit owned-site service/shipping statements outrank proxy geography signals.
  - Similarweb and Instagram agreement strengthens market relevance but does not independently establish commercial availability.
  - When website claims broad/global availability but observed demand is concentrated, retain the broad served market while using concentration only if the output contract supports primary-market ranking.
  - When evidence remains ambiguous, prefer the narrower defensible market rather than an unsupported broad market.

fallback_policy:
  level_1: website_only_when_external_sources_absent
  level_2: business_geography_when_market_not_resolvable_from_evidence
  level_3: country_when_business_geography_is_unavailable
  rule: Fallback values are valid resolved markets, not processor failures, because the brand's own operating geography is the minimum defensible market assumption for MVP.

non_goals:
  - Do not redefine country or business_geography.
  - Do not infer audience demographics beyond geography.
  - Do not determine reporting_currency.
  - Do not treat traffic geography as commercial availability.
