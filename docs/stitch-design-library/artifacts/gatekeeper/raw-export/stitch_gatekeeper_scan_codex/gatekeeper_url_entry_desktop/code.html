<style>
        .custom-checkbox {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 20px;
            height: 20px;
            border: 1px solid #E5E7EB;
            border-radius: 4px;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .custom-checkbox::before {
            content: "";
            width: 12px;
            height: 12px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: transparent;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked {
            background-color: #006c4b;
            border-color: #006c4b;
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        .loader {
            width: 24px;
            height: 24px;
            border: 2px solid #dde4dd;
            border-bottom-color: #006c4b;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-surface-page min-h-screen flex flex-col items-center justify-center font-body text-body text-on-surface antialiased">
<!-- Main Container -->
<main class="w-full max-w-[560px] mx-auto p-md sm:p-lg">
<!-- Header/Logo Area -->
<div class="flex flex-col items-center text-center mb-lg">
<img alt="Gatekeeper Logo" class="h-[33px] w-auto mb-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDBRrO8xH-GFSVyhX_1DC6HkyloPEdzKrDxXN-UcMst1xdICiQOIKlwxNOXq1y6MjRsf_zcCAOM_qU99kqNEW_IeTeXOBT-b3iSnyFAqEX46Y5ouInhlHFKZpkuNOdvDzNlqBBqz1L3K3lpdnsxOZ9MBSSB4nDZZx1p-wr6FpK8qNSAPU3Utvi3EdYWdpqEmrUIdUVsh6LocTq4XZK5uXSPGK11O5NDXSfsThXWCKMmbuWyjG9ZDZ1sO3HlUNTJRFEvjJc"/>
<h1 class="font-h1 text-h1 text-on-surface mb-xs">Brand Analysis</h1>
<p class="text-text-muted font-body text-body">Enter your brand's primary URL to begin the evaluation process.</p>
</div>
<!-- Form Card -->
<div class="bg-surface-card border border-border-default rounded-xl p-md sm:p-lg shadow-sm w-full">
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- URL Input Field -->
<div class="flex flex-col gap-xs">
<label class="font-label text-label text-on-surface" for="brandUrl">Website URL</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-muted text-[20px]">language</span>
</div>
<input class="w-full h-xl pl-10 pr-4 bg-surface-card border border-status-error text-on-surface font-body text-body rounded-lg focus:outline-none focus:ring-1 focus:ring-status-error focus:border-status-error transition-colors" id="brandUrl" name="brandUrl" placeholder="https://www.yourbrand.com" type="url" value="invalid-url-format"/>
</div>
<!-- Inline Validation Error -->
<div class="flex items-center gap-xs mt-1 text-status-error">
<span class="material-symbols-outlined text-[16px]">error</span>
<p class="font-caption text-caption">Please enter a valid website URL.</p>
</div>
</div>
<!-- Attestation Checkboxes -->
<div class="flex flex-col gap-sm mt-xs">
<!-- Ownership Checkbox -->
<label class="flex items-start gap-3 cursor-pointer group">
<div class="pt-[2px]">
<input class="custom-checkbox" required="" type="checkbox"/>
</div>
<span class="font-body text-body text-on-surface-variant group-hover:text-on-surface transition-colors">
                            I confirm I own or am authorized to represent this brand
                        </span>
</label>
<!-- Terms Checkbox -->
<label class="flex items-start gap-3 cursor-pointer group">
<div class="pt-[2px]">
<input class="custom-checkbox" required="" type="checkbox"/>
</div>
<span class="font-body text-body text-on-surface-variant group-hover:text-on-surface transition-colors">
                            I accept the <a class="text-primary hover:underline font-body-bold" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-body-bold" href="#">Privacy Policy</a>
</span>
</label>
</div>
<!-- CTA Button -->
<button class="mt-xs h-xl w-full bg-primary text-on-primary border border-transparent rounded-lg font-label text-label flex items-center justify-center gap-xs hover:bg-on-primary-container hover:text-white transition-colors" type="button">
<span>Analyze My Brand</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Processing State (Lightweight) -->
<div class="hidden flex items-center justify-center gap-xs mt-2 text-text-muted">
<span class="loader"></span>
<span class="font-caption text-caption">Verifying domain...</span>
</div>
</form>
