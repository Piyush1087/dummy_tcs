<div class="mb-lg">
<h1 class="font-h2-mobile text-h2-mobile text-primary mb-xs">Brand Analysis</h1>
<p class="text-text-muted">Enter your brand's primary website to begin.</p>
</div>
<!-- Form Area -->
<form action="#" class="space-y-md" method="POST">
<!-- URL Input Group -->
<div class="space-y-xs relative">
<label class="font-label text-label block" for="url-entry">Website URL</label>
<div class="relative">
<input class="w-full h-xl px-sm rounded border-2 border-error text-on-surface focus:ring-0 focus:border-error bg-error-container/10 pr-10" id="url-entry" name="url-entry" placeholder="e.g., brand.com" type="text" value="glowtheory"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
<span class="material-symbols-outlined text-error" data-weight="fill" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
</div>
<!-- Inline Error -->
<p class="font-caption text-caption text-error flex items-start gap-1 mt-1">
                        Enter a complete website address, such as glowtheory.com.
                    </p>
<!-- Activity Row -->
<div class="flex items-center gap-2 mt-4 p-3 bg-surface-workflow rounded border border-primary-container/30">
<span class="material-symbols-outlined text-primary animate-spin" data-icon="sync">sync</span>
<span class="font-caption text-caption text-on-surface">Analyzing glowtheory.com…</span>
</div>
</div>
<!-- Consent Section -->
<div class="bg-surface-container-low p-sm rounded border border-border-default">
<div class="flex items-start gap-3">
<div class="flex items-center h-5">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary focus:ring-offset-0 bg-surface-card" id="consent" name="consent" type="checkbox"/>
</div>
<div class="flex-1">
<label class="font-body text-body text-on-surface select-none" for="consent">
                                I confirm I am an authorized representative of this brand. I agree to the <a class="text-primary hover:underline font-body-bold" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-body-bold" href="#">Privacy Policy</a>.
                            </label>
</div>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full h-xl bg-primary text-on-primary-fixed font-label text-label rounded-lg transition-transform active:scale-95 flex items-center justify-center gap-2 mt-sm opacity-50 cursor-not-allowed" type="button">
