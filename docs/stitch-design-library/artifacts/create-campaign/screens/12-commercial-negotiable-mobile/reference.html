<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Campaign Creator - Negotiable Compensation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;700;900&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#45dfa4",
                        "tertiary-fixed-dim": "#ffb787",
                        "inverse-on-surface": "#ebf1ff",
                        "primary-container": "#34d399",
                        "on-tertiary-fixed": "#311300",
                        "surface-variant": "#dce2f3",
                        "on-secondary-fixed": "#141b2b",
                        "primary-fixed-dim": "#45dfa4",
                        "outline-variant": "#bbcac0",
                        "on-primary-fixed-variant": "#005137",
                        "on-primary-fixed": "#002114",
                        "tertiary-fixed": "#ffdcc7",
                        "secondary-fixed-dim": "#c0c6db",
                        "surface": "#FFFFFF",
                        "secondary": "#575e70",
                        "inverse-surface": "#2a313d",
                        "on-tertiary-container": "#783901",
                        "surface-tint": "#006c4b",
                        "primary": "#006c4b",
                        "surface-container-highest": "#dce2f3",
                        "error": "#EF4444",
                        "on-primary-container": "#00563b",
                        "surface-container-low": "#f0f3ff",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#d9dff5",
                        "outline": "#6c7a71",
                        "surface-dim": "#d3daea",
                        "error-container": "#ffdad6",
                        "surface-container": "#e7eefe",
                        "tertiary-container": "#ffa668",
                        "on-secondary-container": "#5c6274",
                        "on-tertiary-fixed-variant": "#723600",
                        "on-surface": "#151c27",
                        "primary-fixed": "#68fcbf",
                        "border": "#E5E7EB",
                        "surface-container-high": "#e2e8f8",
                        "on-surface-variant": "#3c4a42",
                        "on-error-container": "#93000a",
                        "tertiary": "#904c16",
                        "background": "#F9FAFB",
                        "on-secondary-fixed-variant": "#404758",
                        "success": "#059669",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#dce2f7",
                        "on-background": "#151c27",
                        "surface-bright": "#f9f9ff",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "48px",
                        "section-margin": "24px",
                        "card-padding": "16px",
                        "stack-gap": "12px",
                        "container-padding": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Satoshi"],
                        "label-sm": ["\"Source Sans 3\""],
                        "label-md": ["\"Source Sans 3\""],
                        "headline-sm": ["Satoshi"],
                        "headline-lg": ["Satoshi"],
                        "body-md": ["\"Source Sans 3\""],
                        "body-lg": ["\"Source Sans 3\""]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-sm": ["16px", { "lineHeight": "24px", "fontWeight": "700" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
            background-color: #F9FAFB;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md w-full h-full min-h-screen flex flex-col justify-between max-w-[390px] mx-auto relative overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-inverse-surface h-[56px] w-full flex items-center border-b border-border dark:border-outline-variant transition-colors duration-200 flex justify-between px-container-padding sticky top-0 z-50 pt-safe">
<button class="w-10 h-10 flex items-center justify-center -ml-2 rounded-full hover:bg-surface-container-low dark:hover:bg-on-surface-variant text-on-surface-variant dark:text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface dark:text-inverse-on-surface truncate px-2 font-bold flex-1 text-center">Create Campaign</h1>
<span class="font-label-sm text-label-sm text-on-surface-variant dark:text-on-surface-variant whitespace-nowrap">Saved just now</span>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-container-padding py-section-margin overflow-y-auto no-scrollbar pb-[160px]">
<!-- Workflow Context -->
<div class="mb-section-margin">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Commercial Strategy</h2>
<!-- Compact Stepper -->
<div class="flex items-center space-x-2 w-full mt-4">
<div class="flex-1 h-1.5 bg-primary-container rounded-full"></div>
<div class="flex-1 h-1.5 bg-primary-container rounded-full"></div>
<div class="flex-1 h-1.5 bg-primary-container rounded-full relative">
<div class="absolute -top-6 right-0 font-label-sm text-label-sm text-primary">Step 3 of 3</div>
</div>
</div>
</div>
<!-- Creator Compensation Section -->
<section class="mb-section-margin bg-surface p-card-padding rounded-xl border border-border shadow-sm">
<h3 class="font-label-md text-label-md text-on-surface mb-4">Creator Compensation</h3>
<!-- Selection Cards -->
<div class="grid grid-cols-2 gap-stack-gap mb-6">
<!-- Fixed Option (Unselected) -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl border border-border bg-surface hover:bg-surface-container-lowest transition-colors h-[80px]">
<span class="font-label-md text-label-md text-on-surface">Fixed</span>
</button>
<!-- Negotiable Option (Selected) -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-primary-container bg-surface-container-low relative h-[80px] shadow-sm">
<span class="font-label-md text-label-md text-on-surface">Negotiable</span>
<div class="absolute top-2 right-2 bg-primary-container rounded-full w-5 h-5 flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-surface font-bold">check</span>
</div>
</button>
</div>
<!-- Input Field -->
<div class="mb-2">
<label class="block font-label-md text-label-md text-on-surface mb-2">Payout Starting From</label>
<div class="relative flex items-center w-full h-touch-target-min bg-surface border border-border rounded-lg overflow-hidden focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<input class="flex-1 bg-transparent border-none focus:ring-0 px-4 h-full font-body-md text-body-md text-on-surface w-full" placeholder="Enter amount" type="text" value="₹20,000"/>
<div class="px-4 h-full flex items-center bg-surface-container-lowest border-l border-border font-label-sm text-label-sm text-on-surface-variant">INR</div>
</div>
<p class="mt-2 font-label-sm text-label-sm text-on-surface-variant flex items-start gap-1">
<span class="material-symbols-outlined text-[16px]">info</span>
                    Creators may make one counter-offer.
                </p>
</div>
</section>
<!-- Campaign Budget Section -->
<section class="mb-section-margin bg-surface p-card-padding rounded-xl border border-border shadow-sm">
<div class="mb-2">
<label class="block font-label-md text-label-md text-on-surface mb-2">Total Campaign Budget</label>
<div class="relative flex items-center w-full h-touch-target-min bg-surface border border-border rounded-lg overflow-hidden focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<input class="flex-1 bg-transparent border-none focus:ring-0 px-4 h-full font-body-md text-body-md text-on-surface w-full" placeholder="Enter amount" type="text" value="₹5,00,000"/>
<div class="px-4 h-full flex items-center bg-surface-container-lowest border-l border-border font-label-sm text-label-sm text-on-surface-variant">INR</div>
</div>
<p class="mt-2 font-label-sm text-label-sm text-on-surface-variant flex items-start gap-1">
<span class="material-symbols-outlined text-[16px]">info</span>
                    Used across creator payouts for this Campaign. Brand support value is tracked separately.
                </p>
</div>
</section>
</main>
<!-- Bottom Persistent Action Region -->
<div class="fixed bottom-[64px] left-0 w-full max-w-[390px] bg-surface/95 backdrop-blur-md border-t border-border p-4 z-40 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<div class="flex gap-4">
<button class="flex-1 h-touch-target-min rounded-lg border border-border bg-surface text-on-surface font-label-md text-label-md flex items-center justify-center hover:bg-surface-container-lowest transition-colors">
                Back
            </button>
<button class="flex-1 h-touch-target-min rounded-lg bg-primary-container text-on-primary font-label-md text-label-md flex items-center justify-center hover:bg-primary-fixed transition-colors shadow-sm">
                Publish Campaign
            </button>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full max-w-[390px] h-[64px] flex justify-around items-center px-4 pb-safe bg-surface dark:bg-inverse-surface border-t border-border dark:border-outline-variant z-50">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed scale-95 duration-100 transition-colors">
<span class="material-symbols-outlined mb-1">dashboard</span>
<span class="font-label-sm text-[10px]">Dashboard</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-on-primary-fixed-variant text-on-primary-container dark:text-primary-fixed-dim rounded-full px-4 py-1 scale-95 duration-100 transition-colors">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">campaign</span>
<span class="font-label-sm text-[10px] font-bold">Campaigns</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed scale-95 duration-100 transition-colors">
<span class="material-symbols-outlined mb-1">analytics</span>
<span class="font-label-sm text-[10px]">Reports</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed scale-95 duration-100 transition-colors">
<span class="material-symbols-outlined mb-1">settings</span>
<span class="font-label-sm text-[10px]">Settings</span>
</button>
</nav>
</body></html>
